[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storyquest"
version = "0.1.0"
description = "StoryQuest Copilot: a book-grounded storytelling agent for children."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "datasette>=0.65", "types-PyYAML"]

[project.scripts]
storyquest = "storyquest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
storyquest = ["stores/migrations/*/*.sql", "agent/prompts/*.txt", "evaluation/prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "integration: uses real SQLite files or the API test client",
    "live: calls the real model endpoint; run on purpose",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/storyquest/evaluation/html_report.py" = ["E501"]  # long HTML and CSS strings

[tool.mypy]
strict = true
files = ["src"]
